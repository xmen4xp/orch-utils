apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-datamodel-install
  namespace: {{ tpl (.Values.global.namespace.name | default .Release.Namespace) . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nexus-crd-admin
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: ["nexus.com"]
    resources: ["datamodels", "extensionrestapis", "extensionrestapiendpoints"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-crd-admin-binding
subjects:
  - kind: ServiceAccount
    name: nexus-datamodel-install
    namespace: {{ tpl (.Values.global.namespace.name | default .Release.Namespace) . }}
roleRef:
  kind: ClusterRole
  name: nexus-crd-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.global.datamodelName }}-dmi
  namespace: {{ tpl (.Values.global.namespace.name | default .Release.Namespace) . }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      annotations:
        "sidecar.istio.io/inject": "false"
    spec:
      serviceAccountName: nexus-datamodel-install
      {{- if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      containers:
      - image: "{{ .Values.image.repository }}:{{ .Values.global.releaseTag | default .Values.image.tag }}"
        env:
          - name: NAME
            value: {{ .Values.global.datamodelName }}
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        name: datamodel-installer-job
      restartPolicy: Never

