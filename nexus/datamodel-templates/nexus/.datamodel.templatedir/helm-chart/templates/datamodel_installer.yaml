
{{- if not (lookup "v1" "ServiceAccount" (default .Release.Namespace .Values.namespace) "nexus-datamodel-install") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-datamodel-install
  namespace: {{ default .Release.Namespace .Values.namespace }}
{{- end }}
---
{{- if not (lookup "rbac.authorization.k8s.io/v1" "ClusterRole" "" "nexus-crd-admin") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nexus-crd-admin
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: ["nexus.com"]
    resources: ["datamodels", "extensionrestapis", "extensionrestapiendpoints"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  # Needed by datamodel_installer.sh to resolve multi-version CRDs'
  # conversion webhook target via nexus-api-gw's
  # app.kubernetes.io/component=nexus-api-gw Service label (get/list only -
  # read-only discovery, no write access needed).
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
{{- end }}
---
{{- if not (lookup "rbac.authorization.k8s.io/v1" "ClusterRoleBinding" "" "nexus-crd-admin-binding") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-crd-admin-binding
subjects:
  - kind: ServiceAccount
    name: nexus-datamodel-install
    namespace: {{ default .Release.Namespace .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: nexus-crd-admin
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.global.datamodelName }}-dmi
  namespace: {{ default  .Release.Namespace .Values.global.namespace }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      annotations:
        "sidecar.istio.io/inject": "false"
    spec:
      serviceAccountName: nexus-datamodel-install
      containers:
      - image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        env:
          - name: NAME
            value: {{ .Values.global.datamodelName }}
          # Used by datamodel_installer.sh to resolve multi-version CRDs'
          # conversion webhook target: nexus-runtime is typically a sibling
          # subchart under this same release in production, so on a first
          # install its Service (named "<release>-nexus-api-gw" by Helm's
          # chart-name templating) won't exist yet for a label-selector
          # lookup to find - this release name lets the installer guess the
          # same name nexus-runtime's own chart will produce.
          - name: HELM_RELEASE_NAME
            value: {{ .Release.Name | quote }}
        {{- if .Values.imagePull }}
        imagePullPolicy: Always
        {{- else }}
        imagePullPolicy: IfNotPresent
        {{- end }}
        {{- if .Values.image.imagePullSecret }}
        imagePullSecrets:
          - name: {{ .Values.image.imagePullSecret }}
        {{- end }}
        name: datamodel-installer-job
      restartPolicy: Never
