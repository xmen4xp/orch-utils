
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-datamodel-install
  namespace: {{ default  .Release.Namespace .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crd-admin
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
  - apiGroups: ["nexus.com"]
    resources: ["datamodels"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crd-admin-binding
subjects:
  - kind: ServiceAccount
    name: nexus-datamodel-install
    namespace: {{ default  .Release.Namespace .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: crd-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.datamodelName }}-dmi
  namespace: {{ default  .Release.Namespace .Values.namespace }}
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      annotations:
        "sidecar.istio.io/inject": "false"
    spec:
      serviceAccountName: nexus-datamodel-install
      containers:
      - env:
          - name: NAME
            value: {{ .Values.datamodelName }}
        image: {{ .Values.image }}
        {{ if eq .Values.imagePull true }}
        imagePullPolicy: Always
        {{ end }}
        name: datamodel-installer-job
      restartPolicy: Never
