apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nexus-api-gw
  labels:
    app.kubernetes.io/name: nexus-api-gw
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: nexus-api-gw
spec:
  replicas: {{ .Values.nexusApiGw.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-api-gw
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nexus-api-gw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-api-gw
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nexus-api-gw
    spec:
      serviceAccountName: {{ .Release.Name }}-nexus-api-gw
      {{- if .Values.global.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.global.imagePullSecret }}
      {{- end }}
      initContainers:
      - name: wait-for-datamodel-cr
        image: "{{ .Values.nexusK8sProxy.image.repository }}:{{ .Values.global.releaseTag | default .Values.nexusK8sProxy.image.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        command: ["/bin/sh"]
        args:
          - "-c"
          - |
            until ./kubectl get datamodels.nexus.com/nexus-datamodel >/dev/null 2>&1; do
              echo "Waiting for nexus-datamodel CR to be created..."
              sleep 5
            done
            echo "nexus-datamodel CR found, proceeding..."
      containers:
        - name: nexus-api-gw
          image: "{{ .Values.nexusApiGw.image.repository }}:{{ .Values.global.releaseTag | default .Values.nexusApiGw.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: GATEWAY_MODE
              value: {{ .Values.nexusApiGw.gatewayMode | quote }}
            - name: LOG_LEVEL
              value: trace
            - name: KUBECONFIG
              value: /kubeconfig/config
          ports:
            - name: http
              containerPort: {{ .Values.config.server.httpPort | default 80 }}
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config/api-gw-config
              subPath: api-gw-config
            - name: kubeconfig
              mountPath: /kubeconfig
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-nexus-api-gw
        - name: kubeconfig
          configMap:
            name: {{ .Release.Name }}-nexus-k8s-proxy-kubeconfig
