apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nexus-api-gw
  labels:
    app.kubernetes.io/name: nexus-api-gw
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: nexus-api-gw
spec:
  replicas: {{ .Values.nexusApiGw.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-api-gw
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nexus-api-gw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-api-gw
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nexus-api-gw
    spec:
      serviceAccountName: {{ .Release.Name }}-nexus-api-gw
      initContainers:
      - name: wait-for-datamodel-job
        image: "{{ .Values.nexusK8sProxy.image.repository }}:{{ .Values.nexusK8sProxy.image.tag }}"
        imagePullPolicy: {{ .Values.nexusK8sProxy.image.pullPolicy }}
        command: ["/kubectl"]
        args:
          - "wait"
          - "--for=condition=complete"
          - "job/{{ .Values.global.datamodelName }}-dmi"
          - "-n"
          - "{{ .Release.Namespace }}"
          - "--timeout=300s"
      containers:
        - name: nexus-api-gw
          image: "{{ .Values.nexusApiGw.image.repository }}:{{ .Values.nexusApiGw.image.tag }}"
          imagePullPolicy: {{ .Values.nexusApiGw.image.pullPolicy }}
          env:
            - name: GATEWAY_MODE
              value: {{ .Values.nexusApiGw.gatewayMode | quote }}
            - name: LOG_LEVEL
              value: trace
            - name: KUBECONFIG
              value: /kubeconfig/config
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config/api-gw-config
              subPath: api-gw-config
            - name: kubeconfig
              mountPath: /kubeconfig
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-nexus-api-gw
        - name: kubeconfig
          configMap:
            name: {{ .Release.Name }}-nexus-k8s-proxy-kubeconfig
