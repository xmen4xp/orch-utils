{{- if .Values.nexusK8sProxy.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-nexus-k8s-proxy" .Release.Name | trunc 63 | trimSuffix "-" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ printf "%s-nexus-k8s-proxy" .Release.Name | trunc 63 | trimSuffix "-" }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
{{- if .Values.nexusApiGw.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-nexus-api-gw
subjects:
- kind: ServiceAccount
  name: {{ .Release.Name }}-nexus-api-gw
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
{{- end -}}
